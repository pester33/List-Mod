name: Inspect list site

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-site.yml"

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download site
        run: |
          mkdir -p site-dump
          cd site-dump
          BASE="http://gdgl.x10.mx/gdgaminglist/"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          curl -sSL -A "$UA" -c jar.txt -b jar.txt -D headers.txt "$BASE" -o index.html || true
          # x10  hosting sometimes serves a JS cookie check first; retry with cookies
          curl -sSL -A "$UA" -c jar.txt -b jar.txt "$BASE" -o index2.html || true
          # Grab scripts / data files the page references
          grep -oE '(src|href)="[^"]+\.(js|json|php)[^"]*"' index*.html | sed -E 's/.*="([^"]+)"/\1/' | sort -u > refs.txt || true
          grep -oE "fetch\(['\"][^'\"]+['\"]" index*.html >> refs.txt || true
          cat refs.txt
          while read -r ref; do
            ref=$(echo "$ref" | sed -E "s/fetch\(['\"]//; s/['\"]$//")
            case "$ref" in
              http*) url="$ref" ;;
              /*) url="http://gdgl.x10.mx$ref" ;;
              *) url="$BASE$ref" ;;
            esac
            name=$(echo "$ref" | sed 's#[/?=&:]#_#g' | cut -c1-80)
            curl -sSL -A "$UA" -b jar.txt "$url" -o "ref_$name" || true
          done < refs.txt
          curl -sSL -A "$UA" -b jar.txt "${BASE}roulette" -o roulette.html || true
          curl -sSL -A "$UA" -b jar.txt "${BASE}1" -o level1.html || true
          curl -sSL -A "$UA" -b jar.txt "${BASE}60" -o level60.html || true
          rm -f jar.txt
          ls -la
      - name: Commit dump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add site-dump
          git commit -m "Site dump" || echo "nothing to commit"
          git push
